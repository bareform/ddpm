[dataset]
dataset = "afhq"

[model]
ddpm_in_channels = [64, 128, 256, 512]
ddpm_timesteps = 1000

[training]
batch_size = 64
num_workers = 4
pin_memory = true
n_steps = 500000

image_height = 64
image_width = 64

lr = 0.0002
adam_beta1 = 0.9
adam_beta2 = 0.999

ema_weight_decay = 0.9999

use_torch_compile = true
mixed_precision = "bf16"

random_seed = 0

[evaluation]
checkpoint_dir = "./checkpoints"
save_checkpoint_interval = 500000

output_dir = "./output"
save_output_interval = 100000

nrow = 9

compute_fid_interval = 100000
